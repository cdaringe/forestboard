; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = genericSTM32F411RE

[env]
platform = ststm32
framework = arduino
upload_protocol = dfu
debug_tool = stlink
; Reserve the final two 128 KiB flash sectors for the keystroke-count journal.
board_upload.maximum_size = 262144
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.12.6
    adafruit/Adafruit SH110X @ ^2.1.15

; Production keyboard firmware for the current WeAct STM32F4 CoreBoard.
[env:genericSTM32F411RE]
board = genericSTM32F411RE
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_HID
    -D ERGOBOARD_KEYBOARD_MODE
    -Wl,--wrap=USBD_CtlSendData

; Production keyboard firmware for the future drop-in CoreBoard.
[env:genericSTM32F446RE]
board = genericSTM32F446RE
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_HID
    -D ERGOBOARD_KEYBOARD_MODE
    -Wl,--wrap=USBD_CtlSendData

; Slow, deterministic OLED isolation builds. Keyboard scanning and HID remain
; active, but regular animations and their overlays are bypassed.
[env:genericSTM32F411RE_oled_debug]
extends = env:genericSTM32F411RE
build_flags =
    ${env:genericSTM32F411RE.build_flags}
    -D ERGOBOARD_OLED_DEBUG_MODE=1

[env:genericSTM32F446RE_oled_debug]
extends = env:genericSTM32F446RE
build_flags =
    ${env:genericSTM32F446RE.build_flags}
    -D ERGOBOARD_OLED_DEBUG_MODE=1
